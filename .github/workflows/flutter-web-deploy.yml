name: Deploy Flutter Web

on:
  push:
    branches: [ main ]
    paths:
      - 'smis_flutter/**'
      - '.github/workflows/flutter-web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Show Flutter version
        working-directory: smis_flutter
        run: flutter --version

      - name: Get dependencies
        working-directory: smis_flutter
        run: flutter pub get

      - name: Prepare PowerSync web assets
        working-directory: smis_flutter
        run: dart run powersync:setup_web

      - name: Build production web app
        working-directory: smis_flutter
        run: |
          set -euo pipefail

          flutter build web --release -t lib/main_production.dart

          WEB_BUILD_DIR="$GITHUB_WORKSPACE/smis_flutter/build/web"

          cat > "$WEB_BUILD_DIR/web.config" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="Flutter Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="./index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

          echo "Flutter web build directory:"
          echo "$WEB_BUILD_DIR"
          echo "Generated top-level files:"
          find "$WEB_BUILD_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify deployment bundle
        working-directory: .
        run: |
          set -euo pipefail

          WEB_BUILD_DIR="$GITHUB_WORKSPACE/smis_flutter/build/web"

          test -d "$WEB_BUILD_DIR"
          test -f "$WEB_BUILD_DIR/index.html"
          test -f "$WEB_BUILD_DIR/main.dart.js"
          test -f "$WEB_BUILD_DIR/web.config"
          test -f "$WEB_BUILD_DIR/sqlite3.wasm"
          test -f "$WEB_BUILD_DIR/powersync_db.worker.js"
          test -f "$WEB_BUILD_DIR/sqflite_sw.js"

          echo "Deployment bundle verified at $WEB_BUILD_DIR"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: smis-flutter-web
          path: smis_flutter/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Install SFTP client
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to MonsterASP.NET
        working-directory: .
        env:
          MONSTER_FTP_HOST: ${{ secrets.MONSTER_FTP_HOST }}
          MONSTER_FTP_USERNAME: ${{ secrets.MONSTER_FTP_USERNAME }}
          MONSTER_FTP_PASSWORD: ${{ secrets.MONSTER_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$MONSTER_FTP_HOST"
          test -n "$MONSTER_FTP_USERNAME"
          test -n "$MONSTER_FTP_PASSWORD"

          MONSTER_FTP_HOST="${MONSTER_FTP_HOST#ftp://}"
          MONSTER_FTP_HOST="${MONSTER_FTP_HOST#sftp://}"
          MONSTER_FTP_HOST="${MONSTER_FTP_HOST%/}"

          WEB_BUILD_DIR="$GITHUB_WORKSPACE/smis_flutter/build/web"

          lftp -u "$MONSTER_FTP_USERNAME","$MONSTER_FTP_PASSWORD" "sftp://$MONSTER_FTP_HOST:22" <<EOF
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose \
            --exclude-glob .well-known \
            --exclude-glob .well-known/** \
            "$WEB_BUILD_DIR" /wwwroot
          bye
          EOF
