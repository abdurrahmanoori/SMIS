name: Deploy API

on:
  push:
    branches: [ main ]
    paths:
      - 'SMIS.Api/**'
      - 'SMIS.Application/**'
      - 'SMIS.Domain/**'
      - 'SMIS.Infrastructure.Server/**'
      - 'SMIS.Test/**'
      - 'Directory.Packages.props'
      - 'appsettings.shared.json'
      - 'SMIS.sln'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API dependencies
        run: dotnet restore SMIS.Api/SMIS.Api.csproj

      - name: Build API
        run: dotnet build SMIS.Api/SMIS.Api.csproj --no-restore --configuration Release


      - name: Publish API
        run: dotnet publish SMIS.Api/SMIS.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Verify API publish output
        run: |
          test -f ./publish/SMIS.Api.dll
          test -f ./publish/web.config
          test -f ./publish/appsettings.json
          test -f ./publish/appsettings.shared.json

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: smis-api
          path: ./publish
          if-no-files-found: error
          retention-days: 7

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Put API offline
        env:
          API_MONSTER_FTP_HOST: ${{ secrets.API_MONSTER_FTP_HOST }}
          API_MONSTER_FTP_USERNAME: ${{ secrets.API_MONSTER_FTP_USERNAME }}
          API_MONSTER_FTP_PASSWORD: ${{ secrets.API_MONSTER_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$API_MONSTER_FTP_HOST"
          test -n "$API_MONSTER_FTP_USERNAME"
          test -n "$API_MONSTER_FTP_PASSWORD"

          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#ftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#sftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST%/}"

          cat > /tmp/app_offline.htm <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>SMIS API deployment</title></head>
          <body>SMIS API is being updated. Please try again shortly.</body>
          </html>
          EOF

          lftp -u "$API_MONSTER_FTP_USERNAME","$API_MONSTER_FTP_PASSWORD" "sftp://$API_MONSTER_FTP_HOST:22" <<'EOF'
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          put /tmp/app_offline.htm -o /wwwroot/app_offline.htm
          bye
          EOF

          sleep 5

      - name: Deploy API to MonsterASP.NET
        env:
          API_MONSTER_FTP_HOST: ${{ secrets.API_MONSTER_FTP_HOST }}
          API_MONSTER_FTP_USERNAME: ${{ secrets.API_MONSTER_FTP_USERNAME }}
          API_MONSTER_FTP_PASSWORD: ${{ secrets.API_MONSTER_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#ftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#sftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST%/}"
          PUBLISH_DIR="$GITHUB_WORKSPACE/publish"

          lftp -u "$API_MONSTER_FTP_USERNAME","$API_MONSTER_FTP_PASSWORD" "sftp://$API_MONSTER_FTP_HOST:22" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          mirror --reverse --delete --verbose --no-perms \
            --exclude-glob .well-known \
            --exclude-glob .well-known/** \
            --exclude-glob app_offline.htm \
            --exclude-glob appsettings.Production.json \
            "$PUBLISH_DIR" /wwwroot
          bye
          EOF

      - name: Bring API online
        if: always()
        env:
          API_MONSTER_FTP_HOST: ${{ secrets.API_MONSTER_FTP_HOST }}
          API_MONSTER_FTP_USERNAME: ${{ secrets.API_MONSTER_FTP_USERNAME }}
          API_MONSTER_FTP_PASSWORD: ${{ secrets.API_MONSTER_FTP_PASSWORD }}
        run: |
          set +e

          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#ftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST#sftp://}"
          API_MONSTER_FTP_HOST="${API_MONSTER_FTP_HOST%/}"

          lftp -u "$API_MONSTER_FTP_USERNAME","$API_MONSTER_FTP_PASSWORD" "sftp://$API_MONSTER_FTP_HOST:22" <<'EOF'
          set sftp:auto-confirm yes
          rm -f /wwwroot/app_offline.htm
          bye
          EOF

      - name: Verify deployed API
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://api-smis.runasp.net/swagger/v1/swagger.json \
            > /dev/null
