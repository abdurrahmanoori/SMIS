name: API Build Artifact

on:
  push:
    branches: [ main ]
    paths:
      - 'SMIS.Api/**'
      - 'SMIS.Application/**'
      - 'SMIS.Domain/**'
      - 'SMIS.Infrastructure.Server/**'
      - 'SMIS.Test/**'
      - 'Directory.Packages.props'
      - 'appsettings.shared.json'
      - 'SMIS.sln'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

jobs:
  build-api-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API dependencies
        run: dotnet restore SMIS.Api/SMIS.Api.csproj

      - name: Build API
        run: dotnet build SMIS.Api/SMIS.Api.csproj --no-restore --configuration Release


      - name: Publish API
        run: dotnet publish SMIS.Api/SMIS.Api.csproj --configuration Release --output ./publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smis-api
          path: ./publish
