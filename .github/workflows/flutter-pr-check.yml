name: Flutter PR check

on:
  pull_request:
    branches: [main]
    paths:
      - 'smis_flutter/**'
      - '.github/workflows/flutter-pr-check.yml'

jobs:
  flutter-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smis_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/data/stock_api.dart lib/data/stock_offline_store.dart lib/data/powersync/app_powersync_database.dart lib/data/powersync/app_powersync_schema.dart lib/screens/stock_screen.dart lib/screens/home_screen.dart
      - run: flutter build apk --debug
